name: Wave Field Scanner APK

on:
  push:
    branches: [wave-field-scanner-apk-build]
    paths:
      - 'WaveFieldScanner_chunks/**'
      - '.github/workflows/wave-field-scanner-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct and verify source
        run: |
          cat WaveFieldScanner_chunks/part_*.b64 | tr -d '\n\r' | base64 -d > WaveFieldScanner_v1.1.0-source.rebuilt.zip
          echo 'ecb19f7e95d34be9ed587e763f32f86f50864dc50410f5013449344fb6203575  WaveFieldScanner_v1.1.0-source.rebuilt.zip' | sha256sum -c -
          unzip -q WaveFieldScanner_v1.1.0-source.rebuilt.zip
      - name: Ensure Android API 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        working-directory: WaveFieldScanner
        run: gradle --no-daemon clean assembleDebug
      - name: Prepare APK
        run: |
          cp WaveFieldScanner/app/build/outputs/apk/debug/app-debug.apk WaveFieldScanner-S10-v1.1.0.apk
          sha256sum WaveFieldScanner-S10-v1.1.0.apk > WaveFieldScanner-S10-v1.1.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WaveFieldScanner-S10-v1.1.0
          path: |
            WaveFieldScanner-S10-v1.1.0.apk
            WaveFieldScanner-S10-v1.1.0.apk.sha256
          if-no-files-found: error
